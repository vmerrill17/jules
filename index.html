<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }

        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }

        h1 { font-size: 3em; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 5px; color: #ff3300; }

        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.5em;
            background: #333;
            color: white;
            border: 2px solid #555;
            cursor: pointer;
            transition: all 0.2s;
            width: 300px;
        }

        button:hover {
            background: #ff3300;
            border-color: #ff3300;
            color: black;
            transform: scale(1.05);
        }

        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: monospace;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 2px black;
            display: none;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Turbo Drift 3D</h1>
        <button id="btn-oval">Oval Circuit</button>
        <button id="btn-figure8">Figure 8</button>
        <button id="btn-complex">Complex Track</button>
    </div>

    <div id="hud">SPEED: 0 KM/H</div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
